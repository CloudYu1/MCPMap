services:
  weather-mcp:
    build: .
    container_name: weather-mcp
    expose:
      - "8000"
    environment:
      - AMAP_API_KEY=${AMAP_API_KEY}
      - APP_NAME=${APP_NAME:-Weather MCP Service}
      - APP_VERSION=${APP_VERSION:-1.0.0}
      - DEBUG=false
      - HOST=0.0.0.0
      - PORT=8000
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-*}
      - LOG_LEVEL=INFO
    restart: unless-stopped
    networks:
      - mcp-network

  nginx:
    image: nginx:alpine
    container_name: weather-mcp-nginx
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/logs:/var/log/nginx
    depends_on:
      - weather-mcp
    restart: unless-stopped
    networks:
      - mcp-network

networks:
  mcp-network:
    driver: bridge
